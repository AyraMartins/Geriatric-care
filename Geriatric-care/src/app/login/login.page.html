<ion-header>
  <ion-toolbar>
    <ion-title>Geriatric Care</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- CADASTRO -->
  <ion-list>

    <ion-item>
      <ion-input [(ngModel)]="nome" placeholder="Nome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="email" placeholder="Email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="telefone" placeholder="Telefone"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="senha" type="password" placeholder="Senha"></ion-input>
    </ion-item>

  </ion-list>

  <ion-button expand="block"  color="danger" (click)="salvarCuidador()" [disabled]="!formValido()">
    Cadastrar
  </ion-button>

  <ion-button expand="block" color="danger" (click)="abrirLogin($event)">
    Login
  </ion-button>

  <!-- MODAL LOGIN -->
  <ion-modal
    [isOpen]="mostrarModalLogin"
    (didDismiss)="fecharLogin()">

    <ng-template>

      <ion-header>
        <ion-toolbar color="danger">
          <ion-title>Login</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">

        <ion-item>
          <ion-input
            [(ngModel)]="emailLogin"
            placeholder="Email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            [(ngModel)]="senhaLogin"
            type="password"
            placeholder="Senha">
          </ion-input>
        </ion-item>

        <ion-button expand="block" (click)="handleLogin()">
          Entrar
        </ion-button>

        <ion-button expand="block" color="medium" (click)="fecharLogin()">
          Cancelar
        </ion-button>

      </ion-content>

    </ng-template>

  </ion-modal>

</ion-content>
