<ion-header>
  <ion-toolbar>
    <ion-title>Geriatric Care</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- CADASTRO -->
  <ion-list>

    <ion-item>
      <ion-input
        [(ngModel)]="nome"
        label="Nome"
        labelPlacement="floating"
        (ionBlur)="nomeTouched = true">
      </ion-input>
    </ion-item>

    <ion-text color="danger" class="erro" *ngIf="nomeTouched && !nome">
      Nome é obrigatório
    </ion-text>

    <ion-item>
      <ion-input
        [(ngModel)]="email"
        label="Email"
        labelPlacement="floating"
        (ionBlur)="emailTouched = true">
      </ion-input>
    </ion-item>

    <ion-text color="danger" class="erro" *ngIf="emailTouched && !email">
      Email é obrigatório
    </ion-text>

    <ion-item>
      <ion-input
        [(ngModel)]="telefone"
        label="Telefone"
        labelPlacement="floating"
        (ionBlur)="telefoneTouched = true">
      </ion-input>
    </ion-item>

    <ion-text color="danger" class="erro" *ngIf="telefoneTouched && !telefone">
      Telefone é obrigatório
    </ion-text>

    <ion-item>
      <ion-input
        [(ngModel)]="senha"
        type="password"
        label="Senha"
        labelPlacement="floating"
        (ionBlur)="senhaTouched = true">
      </ion-input>
    </ion-item>

    <ion-text color="danger" class="erro" *ngIf="senhaTouched && !senha">
      Senha é obrigatória
    </ion-text>

  </ion-list>

  <ion-button expand="block" color="danger"
    (click)="salvarCuidador()"
    [disabled]="!formValido()">
    Cadastrar
  </ion-button>

  <ion-button expand="block" color="danger"
    (click)="abrirLogin($event)">
    Login
  </ion-button>

<!-- MODAL LOGIN estilo folha de ações -->
<ion-modal
  [isOpen]="mostrarModalLogin"
  (didDismiss)="fecharLogin()"
  class="bottom-sheet">

  <ng-template>

    <ion-content class="sheet-content ion-padding">

      <div class="sheet-handle"></div>

      <h2 class="sheet-title">Entrar</h2>

      <ion-item>
        <ion-input
          [(ngModel)]="emailLogin"
          label="Email"
          labelPlacement="floating">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [(ngModel)]="senhaLogin"
          type="password"
          label="Senha"
          labelPlacement="floating">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        color="danger"
        class="btn-entrar"
        (click)="handleLogin()">

        Entrar
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        color="medium"
        (click)="fecharLogin()">

        Cancelar
      </ion-button>

    </ion-content>

  </ng-template>

</ion-modal>

</ion-content>
