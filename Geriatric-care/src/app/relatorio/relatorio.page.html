<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Geriatric-care</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

 

  <!-- CARD MÉDIA -->
  <ion-card>

    <ion-card-header>
      <ion-card-title>
        Média Diária
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <table>

        <tr>
          <th>Data</th>
          <th>Média</th>
          <th>Máx</th>
          <th>Mín</th>
        </tr>

  <tr *ngIf="resumoDiario.length > 0">

  <td>{{ resumoDiario[0].data }}</td>

  <td>{{ resumoDiario[0].media }}</td>

  <td>{{ resumoDiario[0].maximo }}</td>

  <td>{{ resumoDiario[0].minimo }}</td>

</tr>

      </table>

    </ion-card-content>

  </ion-card>

  <!-- GRÁFICO DIA -->
  <ion-card>

    <ion-card-header>
      <ion-card-title>
        Gráfico Diário
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <canvas id="graficoDia"></canvas>

    </ion-card-content>

  </ion-card>

  <!-- GRÁFICO SEMANA -->
  <ion-card>

    <ion-card-header>
      <ion-card-title>
        Gráfico Semanal
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <canvas id="graficoSemana"></canvas>

    </ion-card-content>

  </ion-card>
   <!-- BOTÃO PDF -->
  <ion-button
    expand="block"
    color="danger"
    (click)="baixarPDF()">

    Baixar PDF

  </ion-button>
 <ion-button
    expand="block"
    color="danger"
    (click)="baixarPDF()">

    Enviar para o médico

  </ion-button>

</ion-content>
