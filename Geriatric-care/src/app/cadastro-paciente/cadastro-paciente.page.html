<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Geriatric-Care</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>

    <!-- NOME -->
    <ion-item>

      <ion-input
        [(ngModel)]="nome"
        name="nome"
        label="Nome completo"
        labelPlacement="floating"
        type="text"
        placeholder="Digite seu nome"
        (ionBlur)="nomeTouched = true"
        [clearInput]="true">

      </ion-input>

    </ion-item>

    <!-- ERRO -->
    <ion-text
      color="danger"
      class="erro"
      *ngIf="nomeTouched && !nome">

      Nome é obrigatório

    </ion-text>

    <br>

    <!-- DATA -->
    <ion-item>

      <ion-label>
        Data de Nascimento
      </ion-label>

      <ion-datetime-button
        slot="end"
        datetime="datetime">
      </ion-datetime-button>

    </ion-item>

    <!-- MODAL -->
    <ion-modal [keepContentsMounted]="true">

      <ng-template>

        <ion-datetime
          id="datetime"
          presentation="date"
          locale="pt-BR"
          (ionChange)="pegarData($event)">

        </ion-datetime>

      </ng-template>

    </ion-modal>

  </ion-list>

  <br>

  <!-- BOTÃO -->
  <ion-button
    expand="block"
    color="danger"
    [disabled]="!formValido()"
    (click)="salvarPaciente()">

    Cadastrar

  </ion-button>

</ion-content>
